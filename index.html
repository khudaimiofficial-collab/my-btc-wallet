<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Wallet - Lightning Gateway</title>
  
  <!-- QR Code Generator CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root { --bg: #0b0f19; --card: #131c31; --border: #1e293b; --primary: #00d084; --text: #f8fafc; --muted: #94a3b8; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text); display: flex; justify-content: center; padding: 25px 15px; }
    .wallet-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 450px; padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .badge { background: rgba(0, 208, 132, 0.15); color: var(--primary); border: 1px solid var(--primary); font-size: 11px; font-weight: bold; padding: 4px 8px; border-radius: 20px; }
    button { background: var(--primary); color: black; font-weight: bold; border: none; padding: 12px; width: 100%; border-radius: 8px; font-size: 14px; cursor: pointer; margin-top: 6px; }
    button:hover { background: #00b06f; }
    button:disabled { background: #475569; cursor: not-allowed; }
    input { width: 100%; background: #0b0f19; border: 1px solid #334155; color: white; padding: 10px; border-radius: 8px; font-size: 13px; margin: 5px 0 12px; font-family: monospace; }
    .box { background: #0b0f19; border: 1px solid var(--border); padding: 10px; border-radius: 6px; font-family: monospace; font-size: 11px; word-break: break-all; color: #38bdf8; margin-top: 8px; }
    .qr-wrapper { text-align: center; margin-top: 15px; }
    #qrcode { background: white; padding: 12px; border-radius: 8px; display: inline-block; }
    .hidden { display: none; }
    .tabs { display: flex; gap: 8px; margin-bottom: 18px; }
    .tab-btn { background: #0b0f19; border: 1px solid var(--border); color: var(--muted); padding: 8px; width: 50%; border-radius: 6px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .tab-btn.active { background: var(--border); color: white; border-color: var(--primary); }
    hr { border: 0; border-top: 1px solid var(--border); margin: 20px 0; }
  </style>
</head>
<body>

<div class="wallet-card">
  <div class="header">
    <div>
      <h2>⚡ Speed Wallet</h2>
      <p style="font-size: 12px; color: var(--muted);">Direct Speed.app Lightning Integration</p>
    </div>
    <span class="badge">Speed.app</span>
  </div>

  <!-- Tabs Navigation -->
  <div class="tabs">
    <button id="tabReceive" class="tab-btn active" onclick="switchTab('receive')">Receive Sats</button>
    <button id="tabSend" class="tab-btn" onclick="switchTab('send')">Send to Speed</button>
  </div>

  <!-- TAB 1: RECEIVE DIRECTLY INTO SPEED WALLET -->
  <div id="receivePanel">
    <label style="font-size: 12px; color: var(--muted);">Your Speed Wallet Address:</label>
    <input type="text" id="mySpeedAddress" placeholder="username@speed.app" />

    <label style="font-size: 12px; color: var(--muted);">Amount to Receive (Satoshis):</label>
    <input type="number" id="receiveSats" placeholder="e.g. 100 sats" />

    <button onclick="generateSpeedInvoice()">⚡ Create Speed Invoice</button>
    
    <div id="invoiceResult" class="hidden qr-wrapper">
      <div id="qrcode"></div>
      <div id="invoiceText" class="box"></div>
      <p style="font-size:11px; color:var(--primary); margin-top:8px;">Scan with any Lightning app to deposit straight into your Speed Wallet!</p>
    </div>
  </div>

  <!-- TAB 2: SEND SATS TO ANY SPEED WALLET USER -->
  <div id="sendPanel" class="hidden">
    <label style="font-size: 12px; color: var(--muted);">Recipient's Speed Address:</label>
    <input type="text" id="targetSpeedAddress" placeholder="friend@speed.app" />

    <label style="font-size: 12px; color: var(--muted);">Amount to Send (Satoshis):</label>
    <input type="number" id="sendSats" placeholder="e.g. 50 sats" />

    <button id="fetchPayBtn" onclick="preparePayment()">⚡ Fetch Payment Request</button>

    <div id="payResult" class="hidden">
      <p style="font-size: 12px; color: var(--muted); margin-top: 15px;">Generated Invoice for Speed Wallet:</p>
      <div id="payInvoiceBox" class="box"></div>
      <button style="background:#2563eb; color:white; margin-top:8px;" onclick="copyInvoice()">Copy Invoice to Clipboard</button>
    </div>
  </div>

  <hr/>

  <!-- Speed API Merchant Mode (Optional) -->
  <details style="font-size: 12px; color: var(--muted); cursor: pointer;">
    <summary>Speed.app Developer API Mode</summary>
    <div style="margin-top: 12px;">
      <label>Speed Secret Key (sk_live_... / sk_test_...):</label>
      <input type="password" id="speedApiKey" placeholder="sk_test_..." />
      <button onclick="saveSpeedKey()" style="background:#1e293b; color:white; padding:8px; font-size:12px;">Save API Key</button>
      <div id="apiStatus" style="margin-top:8px; font-size:11px;"></div>
    </div>
  </details>
</div>

<script>
  // 1. Generate an Invoice for your Speed Wallet using standard LNURL-pay
  async function generateSpeedInvoice() {
    const address = document.getElementById("mySpeedAddress").value.trim().toLowerCase();
    const sats = parseInt(document.getElementById("receiveSats").value);
    const resultBox = document.getElementById("invoiceResult");

    if (!address || !address.includes("@") || !sats || sats <= 0) {
      return alert("Please enter a valid Speed Lightning address (e.g. username@speed.app) and sat amount.");
    }

    const [user, domain] = address.split("@");
    resultBox.classList.remove("hidden");
    document.getElementById("invoiceText").innerText = "Contacting Speed.app servers...";

    try {
      // Step A: Fetch LNURL metadata from Speed.app
      const lnurlRes = await fetch(`https://${domain}/.well-known/lnurlp/${user}`);
      const lnurlData = await lnurlRes.json();

      if (!lnurlData.callback) {
        throw new Error(lnurlData.reason || "Could not find this Speed Wallet address.");
      }

      // Step B: Request raw Lightning invoice (BOLT11) in millisatoshis (1 sat = 1000 msats)
      const msats = sats * 1000;
      const callbackRes = await fetch(`${lnurlData.callback}?amount=${msats}`);
      const callbackData = await callbackRes.json();

      if (!callbackData.pr) {
        throw new Error(callbackData.reason || "Failed to create invoice.");
      }

      // Step C: Render Lightning invoice & QR code
      const bolt11 = callbackData.pr;
      document.getElementById("invoiceText").innerText = bolt11;

      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = "";
      new QRCode(qrDiv, { text: bolt11, width: 170, height: 170 });
    } catch (err) {
      document.getElementById("invoiceText").innerText = "Error: " + err.message;
    }
  }

  // 2. Prepare Payment to another Speed Wallet user
  async function preparePayment() {
    const address = document.getElementById("targetSpeedAddress").value.trim().toLowerCase();
    const sats = parseInt(document.getElementById("sendSats").value);
    const btn = document.getElementById("fetchPayBtn");

    if (!address || !address.includes("@") || !sats || sats <= 0) {
      return alert("Please enter a valid recipient address (e.g. friend@speed.app) and sat amount.");
    }

    const [user, domain] = address.split("@");
    btn.disabled = true;
    btn.innerText = "Fetching Invoice from Speed...";

    try {
      const lnurlRes = await fetch(`https://${domain}/.well-known/lnurlp/${user}`);
      const lnurlData = await lnurlRes.json();
      const callbackRes = await fetch(`${lnurlData.callback}?amount=${sats * 1000}`);
      const callbackData = await callbackRes.json();

      if (!callbackData.pr) throw new Error("Could not get invoice from Speed.");

      document.getElementById("payInvoiceBox").innerText = callbackData.pr;
      document.getElementById("payResult").classList.remove("hidden");
    } catch (err) {
      alert("Error: " + err.message);
    } finally {
      btn.disabled = false;
      btn.innerText = "⚡ Fetch Payment Request";
    }
  }

  function copyInvoice() {
    const text = document.getElementById("payInvoiceBox").innerText;
    navigator.clipboard.writeText(text);
    alert("Invoice copied! Open your Speed Wallet or any Lightning app to pay.");
  }

  function switchTab(tab) {
    if (tab === 'receive') {
      document.getElementById("tabReceive").classList.add("active");
      document.getElementById("tabSend").classList.remove("active");
      document.getElementById("receivePanel").classList.remove("hidden");
      document.getElementById("sendPanel").classList.add("hidden");
    } else {
      document.getElementById("tabSend").classList.add("active");
      document.getElementById("tabReceive").classList.remove("active");
      document.getElementById("sendPanel").classList.remove("hidden");
      document.getElementById("receivePanel").classList.add("hidden");
    }
  }

  function saveSpeedKey() {
    const key = document.getElementById("speedApiKey").value.trim();
    if (!key) return alert("Enter your API key.");
    localStorage.setItem("speed_api_key", key);
    document.getElementById("apiStatus").innerHTML = "<span style='color:var(--primary)'>✓ Key saved for Speed.app API calls.</span>";
  }
</script>

</body>
</html>
