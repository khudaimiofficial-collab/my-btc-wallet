<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Speed Wallet - Payment Gateway</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg: #090d16;
      --card: #111827;
      --border: #1f2937;
      --primary: #00d084;
      --primary-hover: #00b06f;
      --text: #f3f4f6;
      --muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }
    .wallet-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 26px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }
    .badge {
      background: rgba(0, 208, 132, 0.15);
      color: var(--primary);
      border: 1px solid var(--primary);
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
    }
    .btn-main {
      background: var(--primary);
      color: black;
      font-weight: bold;
      border: none;
      padding: 12px;
      width: 100%;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      margin-top: 10px;
    }
    .btn-main:hover { background: var(--primary-hover); }
    .btn-main:disabled { background: #475569; cursor: not-allowed; }
    input, select {
      width: 100%;
      background: #090d16;
      border: 1px solid #334155;
      color: white;
      padding: 11px;
      border-radius: 8px;
      font-size: 13px;
      margin: 6px 0 12px;
      font-family: monospace;
    }
    .status-box {
      padding: 10px;
      border-radius: 6px;
      font-size: 12px;
      margin-top: 10px;
      display: none;
      word-break: break-all;
      line-height: 1.5;
    }
    .status-error { background: #450a0a; border: 1px solid #dc2626; color: #fca5a5; }
    .status-success { background: #022c22; border: 1px solid #047857; color: #6ee7b7; }
    .account-bar {
      background: #090d16;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 12px;
    }
    .full-key {
      font-family: monospace;
      color: var(--primary);
      word-break: break-all;
      display: block;
      margin-top: 4px;
      background: #111827;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    .qr-wrapper {
      text-align: center;
      margin-top: 20px;
      background: #090d16;
      padding: 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    #qrcode {
      background: white;
      padding: 10px;
      border-radius: 8px;
      display: inline-block;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

<div class="wallet-card">
  <div class="header">
    <div>
      <h2>⚡ Speed Payment</h2>
      <p style="font-size: 12px; color: var(--muted);">Direct Speed.app Integration</p>
    </div>
    <span class="badge">Speed.app</span>
  </div>

  <!-- STEP 1: VERIFY API KEY -->
  <div id="verifyPanel">
    <p style="font-size: 13px; color: var(--muted); margin-bottom: 12px;">
      Enter your Speed Secret Key (Visible):
    </p>

    <label style="font-size: 12px; color: var(--muted);">Speed Secret Key:</label>
    <!-- type="text" keeps key unhidden and visible -->
    <input type="text" id="apiKeyInput" placeholder="sk_live_... or sk_test_..." />

    <button id="verifyBtn" class="btn-main" onclick="verifyApiKey()">
      Verify API Key
    </button>

    <div id="verifyStatus" class="status-box"></div>
  </div>

  <!-- STEP 2: CREATE PAYMENT (UNLOCKED) -->
  <div id="paymentPanel" class="hidden">
    <div class="account-bar">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span style="color: #4ade80; font-weight: bold;">● Verified API Key:</span>
        <button onclick="disconnectKey()" style="background:transparent; border:none; color:var(--muted); font-size:11px; cursor:pointer; text-decoration:underline;">
          Disconnect
        </button>
      </div>
      <span id="keyDisplay" class="full-key"></span>
    </div>

    <h3 style="font-size: 15px; margin-bottom: 10px;">Create New Payment</h3>

    <label style="font-size: 12px; color: var(--muted);">Amount in Satoshis (sats):</label>
    <input type="number" id="payAmount" placeholder="e.g. 100" value="100" />

    <label style="font-size: 12px; color: var(--muted);">Description / Memo (Optional):</label>
    <input type="text" id="payMemo" placeholder="Order Payment" value="Order Payment" />

    <button id="createPayBtn" class="btn-main" onclick="createPayment()">
      ⚡ Create Payment
    </button>

    <div id="paymentStatus" class="status-box"></div>

    <div id="qrResult" class="qr-wrapper hidden">
      <div id="qrcode"></div>
      <p style="font-size: 12px; margin-top: 12px; color: var(--primary); font-weight: bold;">
        Scan with Speed Wallet or any Lightning app!
      </p>
      <a id="checkoutLink" href="#" target="_blank" style="display:inline-block; margin-top:10px; font-size:12px; color:#38bdf8; text-decoration:underline;">
        Open Speed Hosted Checkout ↗
      </a>
    </div>
  </div>
</div>

<script>
  let activeKey = localStorage.getItem("speed_verified_key") || "";

  if (activeKey) {
    unlockPaymentUI(activeKey);
  }

  // Reliable Dual-Path Caller (Checks Vercel rewrite first, then direct fallback)
  async function callSpeedApi(endpoint, method = "POST", body = null) {
    const key = activeKey || document.getElementById("apiKeyInput").value.trim();
    const authHeader = "Basic " + btoa(key + ":");
    const headers = {
      "Authorization": authHeader,
      "Content-Type": "application/json",
      "Accept": "application/json"
    };

    const payload = body ? JSON.stringify(body) : null;

    // 1. Try Vercel Rewrite route (/api/speed/...)
    let res = await fetch(`/api/speed/${endpoint}`, { method, headers, body: payload }).catch(() => null);

    // 2. Fallback to direct speed API if rewrite fails or gives 403
    if (!res || res.status === 403 || !res.ok) {
      const directRes = await fetch(`https://api.tryspeed.com/v1/${endpoint}`, { method, headers, body: payload }).catch(() => null);
      if (directRes && (directRes.ok || directRes.status === 400 || directRes.status === 401)) {
        res = directRes;
      }
    }

    if (!res) throw new Error("Could not connect to Speed servers.");

    const text = await res.text();
    let data = {};
    try { data = JSON.parse(text); } catch (e) {}

    if (!res.ok) {
      const errMsg = data.message || data.error?.message || text.substring(0, 150) || `HTTP ${res.status}`;
      throw new Error(`[HTTP ${res.status}] ${errMsg}`);
    }

    return data;
  }

  // 1. VERIFY API KEY (Uses valid POST /checkout-sessions)
  async function verifyApiKey() {
    const key = document.getElementById("apiKeyInput").value.trim();
    const btn = document.getElementById("verifyBtn");
    const status = document.getElementById("verifyStatus");

    if (!key) return alert("Please enter your Speed Secret Key.");
    if (!key.startsWith("sk_test_") && !key.startsWith("sk_live_")) {
      return alert("Invalid key format. Speed Secret Keys start with 'sk_test_' or 'sk_live_'.");
    }

    btn.disabled = true;
    btn.innerText = "Verifying with Speed.app...";
    status.style.display = "block";
    status.className = "status-box";
    status.innerText = "Authenticating with Speed API...";

    try {
      activeKey = key;

      // Authenticate by creating a valid test verification session
      const testPayload = {
        amount: 10,
        currency: "SATS",
        payment_methods: ["lightning"],
        statement_descriptor: "Verify Key"
      };

      await callSpeedApi("checkout-sessions", "POST", testPayload);

      // Key authenticated successfully
      localStorage.setItem("speed_verified_key", key);
      status.className = "status-box status-success";
      status.innerText = "✓ Key verified successfully!";

      setTimeout(() => {
        unlockPaymentUI(key);
      }, 500);
    } catch (err) {
      activeKey = "";
      status.className = "status-box status-error";
      status.innerText = "Verification failed: " + err.message;
    } finally {
      btn.disabled = false;
      btn.innerText = "Verify API Key";
    }
  }

  // 2. UNLOCK PAYMENT PANEL (Full Key Shown)
  function unlockPaymentUI(key) {
    document.getElementById("verifyPanel").classList.add("hidden");
    document.getElementById("paymentPanel").classList.remove("hidden");
    document.getElementById("keyDisplay").innerText = key;
  }

  function disconnectKey() {
    localStorage.removeItem("speed_verified_key");
    activeKey = "";
    location.reload();
  }

  // 3. CREATE PAYMENT
  async function createPayment() {
    const amount = parseFloat(document.getElementById("payAmount").value);
    const memo = document.getElementById("payMemo").value || "Payment";
    const btn = document.getElementById("createPayBtn");
    const status = document.getElementById("paymentStatus");
    const qrResult = document.getElementById("qrResult");

    if (!amount || amount <= 0) return alert("Please enter a valid amount.");

    btn.disabled = true;
    btn.innerText = "Creating Payment...";
    status.style.display = "none";
    qrResult.classList.add("hidden");

    try {
      const payload = {
        amount: amount,
        currency: "SATS",
        payment_methods: ["lightning"],
        statement_descriptor: memo.substring(0, 22)
      };

      const session = await callSpeedApi("checkout-sessions", "POST", payload);

      if (!session.url) {
        throw new Error("Speed did not return a checkout URL.");
      }

      // Render QR Code
      const qrDiv = document.getElementById("qrcode");
      qrDiv.innerHTML = "";
      new QRCode(qrDiv, { text: session.url, width: 170, height: 170 });

      document.getElementById("checkoutLink").href = session.url;
      qrResult.classList.remove("hidden");

      status.style.display = "block";
      status.className = "status-box status-success";
      status.innerText = `✓ Payment session created! ID: ${session.id}`;
    } catch (err) {
      status.style.display = "block";
      status.className = "status-box status-error";
      status.innerText = "Payment failed: " + err.message;
    } finally {
      btn.disabled = false;
      btn.innerText = "⚡ Create Payment";
    }
  }
</script>

</body>
</html>
